server:
  port: 7500

spring:
  application:
    # 统一认证服务, 进程和 Docker 镜像唯一命名
    name: aspen-auth-biz
  config:
    import:
      # 配置中心分层: 公共配置在前, 服务私有配置在后; optional 前缀保证本地无 Nacos 也能启动
      - optional:nacos:aspen-common
      - optional:nacos:${spring.application.name}
  # datasource/jimmer/aspen 等运行配置统一放 Nacos 的 aspen-auth-biz, 本文件只保留接线(地址/凭据/命名空间)
  cloud:
    nacos:
      # 地址与凭据经环境变量注入, 无默认值; 生产必须注入且密码不得写进配置文件
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      server-addr: ${NACOS_HOST}:${NACOS_PORT}
      config:
        namespace: ${NACOS_NAMESPACE:prod}
        file-extension: yaml

# Jimmer starter 的语言开关决定 sqlClient Bean 的产出类型: kotlin 时直接产出 KSqlClient
jimmer:
  language: kotlin

aspen:
  security:
    # 客户端配置快照的分发介质环境段, 与 Admin 发布侧保持一致
    environment: local
  auth:
    # JWT 签发私钥 (PKCS#8 base64) 与密钥标识只经环境变量注入, 不进配置中心与仓库
    jwt:
      private-key: ${ASPEN_AUTH_JWT_PRIVATE_KEY:}
      key-id: ${ASPEN_AUTH_JWT_KEY_ID:aspen-default}
    # 主体 SPI 的用户域端点 (Admin), 本地开发直连
    principal:
      base-url: ${ASPEN_AUTH_PRINCIPAL_BASE_URL:http://localhost:7100}
    # 三方行为验证码 (SLIDER 闸门) 服务商校验端点与凭据, 未配置时 SLIDER 闸门拒绝放行
    captcha:
      validate-url: ${ASPEN_AUTH_CAPTCHA_VALIDATE_URL:}
      credential-id: ${ASPEN_AUTH_CAPTCHA_ID:}
      credential-secret: ${ASPEN_AUTH_CAPTCHA_SECRET:}
