# 版本目录是全项目唯一的第三方依赖版本入口
# Spring/Cloud/SCA 管理范围内的库不单独写版本, 避免绕过 BOM 造成兼容性漂移

[versions]
kotlin = "2.3.21"
ksp = "2.3.11"
springBoot = "4.0.8"
springDependencyManagement = "1.1.7"
springCloud = "2025.1.0"
springCloudAlibaba = "2025.1.0.0"
jimmer = "0.11.7"
archunit = "1.5.0"

[libraries]
# Spring Boot: 按模块职责选择 Starter, 不允许公共模块传递整套运行时
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
spring-boot-starter-quartz = { module = "org.springframework.boot:spring-boot-starter-quartz" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }

# Spring Cloud: Gateway 只能用于独立网关模块, 业务服务使用 OpenFeign + LoadBalancer
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }
spring-cloud-openfeign-core = { module = "org.springframework.cloud:spring-cloud-openfeign-core" }

# Spring Cloud Alibaba: 版本由 SCA BOM 统一提供
spring-cloud-alibaba-nacos-discovery = { module = "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery" }
spring-cloud-alibaba-nacos-config = { module = "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config" }
spring-cloud-alibaba-sentinel = { module = "com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel" }
spring-cloud-alibaba-sentinel-gateway = { module = "com.alibaba.cloud:spring-cloud-alibaba-sentinel-gateway" }
spring-cloud-alibaba-stream-rocketmq = { module = "com.alibaba.cloud:spring-cloud-starter-stream-rocketmq" }
sentinel-datasource-nacos = { module = "com.alibaba.csp:sentinel-datasource-nacos" }

# API 契约模块只按需使用注解/API, 不允许引入 Boot Starter 或运行时基础设施
spring-web = { module = "org.springframework:spring-web" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }

# Jimmer 不在 Spring BOM 管理范围内, 因此显式锁定 Starter, SQL Kotlin 与 KSP 的相同版本
jimmer-spring-boot-starter = { module = "org.babyfish.jimmer:jimmer-spring-boot-starter", version.ref = "jimmer" }
jimmer-sql-kotlin = { module = "org.babyfish.jimmer:jimmer-sql-kotlin", version.ref = "jimmer" }
jimmer-ksp = { module = "org.babyfish.jimmer:jimmer-ksp", version.ref = "jimmer" }

# 基础运行库与数据库驱动, MySQL 驱动版本由 Spring Boot BOM 管理
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
# Jackson 3 仍使用 com.fasterxml.jackson.annotation 2.x, Jimmer KSP 生成代码也引用这些注解
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
mysql-connector = { module = "com.mysql:mysql-connector-j" }

# 测试依赖: ArchUnit 用于持续检查 API/Biz, MVC 和 Admin upm/sys 边界
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }

[bundles]
# 普通 API 模块的最小契约依赖, Feign Core 仅在确实发布 Client 时单独增加
api-contract = ["spring-web", "jakarta-validation-api", "jackson-module-kotlin"]

# 独立 Gateway 模块使用该组合, 严禁与业务 MVC/Jimmer 运行时混用;
# Redis 客户端不经本组合引入, 一律经 common-cache 受控操作类访问
gateway-runtime = [
    "spring-cloud-starter-gateway",
    "spring-cloud-alibaba-nacos-discovery",
    "spring-cloud-alibaba-nacos-config",
    "spring-cloud-alibaba-sentinel",
    "spring-cloud-alibaba-sentinel-gateway",
    "sentinel-datasource-nacos",
    "spring-boot-starter-security",
    "spring-boot-starter-security-oauth2-resource-server",
    "spring-boot-starter-actuator",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
