# Gradle 守护进程统一使用 UTF-8, 2 GiB 是当前基础设施项目的保守开发基线
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# 多模块迁移后启用并行构建, 构建缓存和配置缓存, 减少国内网络环境下的重复工作
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 在升级 Gradle, Kotlin 或 Spring 插件时尽早暴露弃用和兼容性问题
org.gradle.warning.mode=all
kotlin.code.style=official
kotlin.incremental=true

# 中国大陆开发环境默认启用国内镜像, 关闭后直接使用官方仓库
aspen.repository.use-china-mirrors=true

# 本地开发允许在国内镜像缺少制品时回退官方仓库
# 自建机房 CI 配好内网 Nexus/Artifactory 后, 建议改为 false, 形成封闭且可审计的依赖来源
aspen.repository.allow-public-fallback=true

# 自建代理不要把账号密码提交到仓库, 优先通过以下环境变量注入:
# ASPEN_MAVEN_REPOSITORY_URL
# ASPEN_MAVEN_REPOSITORY_USERNAME
# ASPEN_MAVEN_REPOSITORY_PASSWORD
# 也可以在 ~/.gradle/gradle.properties 中配置下列同名 Gradle 属性:
# aspen.repository.url=https://nexus.example.internal/repository/maven-public/
# aspen.repository.username=your-user
# aspen.repository.password=your-password
